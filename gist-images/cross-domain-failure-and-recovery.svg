<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Cross-domain failure and recovery decision model</title>
<desc id="svg-desc">After a cross-domain failure, first determine whether the authoritative business outcome is known. If it is unknown, reconcile with the owning domain. If it remains unknown, escalate to a managed exception. With a confirmed outcome, evaluate the business policy: continue if completed, retry if safe, compensate prior effects only when required and permitted, or escalate. Execute through owning domains and preserve recovery history.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#97A8B4" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#176E7A" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1170" fill="#FFFFFF"/>

<text x="72" y="67" fill="#176E7A" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.6">ARCHITECTURE NOTES  /  DISTRIBUTED SYSTEMS</text>
<text x="72" y="124" fill="#172A38" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="47" font-weight="700" text-anchor="start">When a cross-domain process fails</text>
<text x="72" y="162" fill="#506272" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">A recovery decision model — not a distributed rollback</text>
