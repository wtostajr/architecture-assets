<text x="798" y="855" fill="#172A38" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Evaluate confirmed outcome</text>
<text x="798" y="879" fill="#506272" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">and business recovery policy</text>
