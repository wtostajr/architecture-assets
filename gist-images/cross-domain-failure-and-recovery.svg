<rect x="1042" y="548" width="6" height="124" rx="3" fill="#176E7A"/>
<text x="1072" y="581" fill="#176E7A" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="0.95">CONFIRMED BUSINESS STATE</text>
<text x="1072" y="612" fill="#172A38" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">Trust authoritative domain state,</text>
<text x="1072" y="642" fill="#506272" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">not a transport acknowledgment.</text>
