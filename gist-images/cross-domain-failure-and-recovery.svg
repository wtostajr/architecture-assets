<rect x="72" y="548" width="6" height="124" rx="3" fill="#C58A4F"/>
<text x="102" y="581" fill="#AD672C" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.1">RECONCILE</text>
<text x="102" y="612" fill="#172A38" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">Consult the owning domain;</text>
<text x="102" y="642" fill="#506272" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">correlate IDs and delayed events.</text>
