<text x="92" y="989" fill="#176E7A" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0.85">CONTINUE</text>
<text x="92" y="1024" fill="#172A38" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="650" text-anchor="start">If already completed</text>
<text x="92" y="1058" fill="#506272" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Resume from confirmed state.</text>
<rect x="438" y="955" width="358" height="132" rx="15" fill="#F3F9F8" stroke="#D0E1E0" stroke-width="1.5"/>
<rect x="438" y="955" width="358" height="5" rx="2" fill="#176E7A"/>
<text x="458" y="989" fill="#176E7A" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0.85">RETRY</text>
<text x="458" y="1024" fill="#172A38" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="650" text-anchor="start">If incomplete and safe</text>
<text x="458" y="1058" fill="#506272" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Bounded, idempotent operation.</text>
<rect x="804" y="955" width="358" height="132" rx="15" fill="#FEFAF5" stroke="#E8DCCE" stroke-width="1.5"/>
<rect x="804" y="955" width="358" height="5" rx="2" fill="#AD672C"/>
<text x="824" y="989" fill="#AD672C" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0.85">COMPENSATE</text>
<text x="824" y="1024" fill="#172A38" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="650" text-anchor="start">If correction is required</text>
<text x="824" y="1058" fill="#506272" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">New action by the owning domain.</text>
<rect x="1170" y="955" width="358" height="132" rx="15" fill="#FDF8F7" stroke="#EADBD9" stroke-width="1.5"/>
<rect x="1170" y="955" width="358" height="5" rx="2" fill="#B44F49"/>
<text x="1190" y="989" fill="#B44F49" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0.85">ESCALATE</text>
<text x="1190" y="1024" fill="#172A38" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="650" text-anchor="start">If no safe automated path</text>
<text x="1190" y="1058" fill="#506272" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Managed business exception.</text>
<path d="M72 1111 H1528" stroke="#DCE3E7" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="1143" fill="#172A38" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="0.45">03  EXECUTE THROUGH THE OWNING DOMAIN. PRESERVE THE ORIGINAL AND RECOVERY HISTORY.</text>
<text x="1528" y="1143" fill="#B44F49" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end" letter-spacing="0.2">RETRY EXHAUSTED? REASSESS POLICY.</text>
