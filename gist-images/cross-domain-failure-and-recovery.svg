<rect x="72" y="199" width="1456" height="104" rx="14" fill="#F7F9FA" stroke="#E3E9ED" stroke-width="1.5"/>
<rect x="72" y="199" width="6" height="104" rx="3" fill="#B5674B"/>
<text x="102" y="232" fill="#AD672C" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.25">OBSERVED FAILURE</text>
<text x="102" y="268" fill="#172A38" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Payment authorization succeeds; policy issuance times out.</text>
<text x="1486" y="249" fill="#B44F49" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="end" letter-spacing="0.45">TIMEOUT ≠ FAILURE</text>
<text x="1486" y="274" fill="#506272" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="end">The operation may have completed.</text>
<text x="72" y="359" fill="#176E7A" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">01</text>
<text x="111" y="359" fill="#172A38" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0.7">ESTABLISH THE ACTUAL OUTCOME</text>
