<rect x="697" y="594" width="188" height="30" rx="12" fill="#FFFFFF"/>
<text x="791" y="614" fill="#176E7A" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0.5">IF ESTABLISHED</text>
