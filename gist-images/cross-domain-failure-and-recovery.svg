<text x="316" y="734" fill="#AD672C" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Still unknown → managed exception</text>
<text x="72" y="795" fill="#176E7A" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">02</text>
<text x="111" y="795" fill="#172A38" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0.7">CHOOSE AN AUTHORIZED RESPONSE</text>
