<rect x="1191" y="490" width="190" height="29" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="1286" y="510" fill="#176E7A" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0.3">YES  /  CONFIRMED</text>
