<rect x="430" y="388" width="164" height="80" rx="5" fill="#FAF9F6" stroke="#FAF9F6"/>
<text x="512" y="408" text-anchor="middle" font-size="10" font-weight="700" fill="#526174">COMMAND</text>
<text x="512" y="432" text-anchor="middle" font-size="14" font-weight="400" fill="#526174">Assess fraud</text>
<text x="512" y="451" text-anchor="middle" font-size="14" font-weight="400" fill="#526174">risk</text>
<rect x="606" y="388" width="164" height="80" rx="5" fill="#FAF9F6" stroke="#FAF9F6"/>
<text x="688" y="408" text-anchor="middle" font-size="10" font-weight="700" fill="#526174">BUSINESS OUTCOME</text>
<text x="688" y="432" text-anchor="middle" font-size="14" font-weight="400" fill="#526174">Fraud assessment</text>
<text x="688" y="451" text-anchor="middle" font-size="14" font-weight="400" fill="#526174">completed</text>
<rect x="424" y="514" width="352" height="145" rx="16" fill="#FFFFFF" stroke="#DCE2E8"/>
<text x="600" y="551" text-anchor="middle" font-size="20" font-weight="600" fill="#17283D">Fraud Management</text>
<text x="600" y="590" text-anchor="middle" font-size="16" font-weight="400" fill="#526174">Fraud assessment &amp; findings</text>
<text x="600" y="625" text-anchor="middle" font-size="13" font-weight="400" fill="#526174">Fraud rules and findings state</text>
<path d="M888 344 L888 514" fill="none" stroke="#94A3B8" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M1064 514 L1064 344" fill="none" stroke="#94A3B8" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="806" y="388" width="164" height="80" rx="5" fill="#FAF9F6" stroke="#FAF9F6"/>
<text x="888" y="408" text-anchor="middle" font-size="10" font-weight="700" fill="#526174">COMMAND</text>
<text x="888" y="432" text-anchor="middle" font-size="14" font-weight="400" fill="#526174">Execute approved</text>
<text x="888" y="451" text-anchor="middle" font-size="14" font-weight="400" fill="#526174">payment</text>
<rect x="982" y="388" width="164" height="80" rx="5" fill="#FAF9F6" stroke="#FAF9F6"/>
<text x="1064" y="408" text-anchor="middle" font-size="10" font-weight="700" fill="#526174">BUSINESS OUTCOME</text>
<text x="1064" y="432" text-anchor="middle" font-size="14" font-weight="400" fill="#526174">Payment executed</text>
<text x="1064" y="451" text-anchor="middle" font-size="14" font-weight="400" fill="#526174">/ settled</text>
<rect x="800" y="514" width="352" height="145" rx="16" fill="#FFFFFF" stroke="#DCE2E8"/>
<text x="976" y="545" text-anchor="middle" font-size="20" font-weight="600" fill="#17283D">Payment &amp;</text>
<text x="976" y="570" text-anchor="middle" font-size="20" font-weight="600" fill="#17283D">Money Movement</text>
<text x="976" y="601" text-anchor="middle" font-size="16" font-weight="400" fill="#526174">Payment execution &amp; settlement</text>
<text x="976" y="632" text-anchor="middle" font-size="13" font-weight="400" fill="#526174">Payment rules and payment state</text>
<text x="600" y="681" text-anchor="middle" font-size="12" font-weight="600" fill="#526174">INDEPENDENT BOUNDED CONTEXTS · EACH OWNS ITS BUSINESS DECISIONS AND STATE</text>
<path d="M260 692 H940" stroke="#DCE2E8"/>
<text x="600" y="728" text-anchor="middle" font-size="23" font-weight="600" fill="#17283D">Coordinate the process. Keep business state with its owner.</text>
</g></svg>