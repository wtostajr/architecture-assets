<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">When Is Eventual Consistency Acceptable?</title>
<desc id="desc">Decision guide. If stale information cannot be used safely, enforce the invariant when committing the operation. If staleness is acceptable within a limit, establish freshness and handle a breached or unknown bound. If there is no fixed deadline, engineer convergence. All paths must protect business invariants.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1440" height="1040" fill="#f8fafc"/>
<g font-family="Inter, Helvetica, Arial, sans-serif" fill="#0f172a">
<text x="72" y="67" font-size="15" font-weight="700" letter-spacing="2" fill="#64748b">ARCHITECTURE ASSETS · DECISION GUIDE</text>
<text x="72" y="126" font-size="40" font-weight="700">When Is Eventual Consistency Acceptable?</text>
<text x="72" y="166" font-size="21" fill="#475569">Choose the guarantee from the business decision and its invariants.</text>
<rect x="328" y="215" width="784" height="100" rx="16" fill="#0f172a"/>
<text x="720" y="256" text-anchor="middle" fill="white" font-size="24" font-weight="700">Can this consumer safely use stale information</text>
<text x="720" y="288" text-anchor="middle" fill="white" font-size="24" font-weight="700">for its intended decision?</text>
</g>
<g stroke="#64748b" stroke-width="2" fill="none"><path d="M720 315 V345 H276 V399" marker-end="url(#arrow)"/><path d="M720 345 V399" marker-end="url(#arrow)"/><path d="M720 345 H1164 V399" marker-end="url(#arrow)"/></g>
<g font-family="Inter, Helvetica, Arial, sans-serif">
<g text-anchor="middle" font-size="16" font-weight="700"><rect x="244" y="355" width="64" height="28" rx="14" fill="#f8fafc"/><text x="276" y="375" fill="#9f1239">NO</text><rect x="626" y="355" width="188" height="28" rx="14" fill="#f8fafc"/><text x="720" y="375" fill="#92400e">WITHIN A LIMIT</text><rect x="1052" y="355" width="224" height="28" rx="14" fill="#f8fafc"/><text x="1164" y="375" fill="#0f766e">NO FIXED DEADLINE</text></g>
<rect x="72" y="412" width="408" height="375" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="516" y="412" width="408" height="375" rx="16" fill="white" stroke="#cbd5e1"/>
<rect x="960" y="412" width="408" height="375" rx="16" fill="white" stroke="#cbd5e1"/>
<path d="M96 413 H456" stroke="#be123c" stroke-width="4"/><path d="M540 413 H900" stroke="#d97706" stroke-width="4"/><path d="M984 413 H1344" stroke="#0d9488" stroke-width="4"/>
<g fill="#0f172a" font-size="25" font-weight="700"><text x="100" y="463">Enforce the invariant</text><text x="544" y="463">Bound the staleness</text><text x="988" y="463">Engineer convergence</text></g>
<g fill="#475569" font-size="19">
<text x="100" y="506">Protect correctness when the</text><text x="100" y="534">operation commits.</text>
<text x="100" y="584">Use a suitable transaction,</text><text x="100" y="612">reservation, or coordination</text><text x="100" y="640">mechanism.</text>
<text x="100" y="695" font-weight="700" fill="#9f1239">A fresh read alone does not</text><text x="100" y="723" font-weight="700" fill="#9f1239">prevent concurrent conflicts.</text>
<text x="544" y="506">Define the acceptable delay</text><text x="544" y="534">and establish freshness.</text>
<text x="544" y="584">If the bound is exceeded or</text><text x="544" y="612">unknown, defer, reject, or use</text><text x="544" y="640">an authoritative path.</text>
<text x="544" y="695" font-weight="700" fill="#92400e">Last updated does not mean</text><text x="544" y="723" font-weight="700" fill="#92400e">nothing newer is missing.</text>
<text x="988" y="506">Allow lag for the intended use</text><text x="988" y="534">without a fixed freshness bound.</text>
<text x="988" y="584">Design for reliable propagation,</text><text x="988" y="612">idempotency, ordering,</text><text x="988" y="640">recovery, and reconciliation.</text>
<text x="988" y="695" font-weight="700" fill="#0f766e">Detect divergence and repair</text><text x="988" y="723" font-weight="700" fill="#0f766e">failed processing.</text>
</g>
<rect x="72" y="827" width="1296" height="107" rx="16" fill="#e2e8f0"/>
<text x="720" y="871" text-anchor="middle" fill="#0f172a" font-size="25" font-weight="700">Temporary divergence must not become an invalid business decision.</text>
<text x="720" y="906" text-anchor="middle" fill="#475569" font-size="18">Every path must preserve the applicable business invariants.</text>
<text x="72" y="985" fill="#64748b" font-size="16">Apply this guide per operation and consumer—not once for the entire entity.</text>
</g></svg>
