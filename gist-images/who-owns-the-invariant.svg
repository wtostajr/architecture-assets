<svg xmlns="http://www.w3.org/2000/svg" width="880" height="720" viewBox="0 0 880 720" role="img" aria-labelledby="title desc">
  <title id="title">Who Owns the Invariant?</title>
  <desc id="desc">Underwriting owns risk rules and makes the risk decision. A downward arrow labeled RiskAccepted / RiskDeclined connects Underwriting to Policy Servicing, which consumes the decision and owns the policy lifecycle.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 9 6 L 2 10" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="880" height="720" fill="#F7F7F5"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="170" y="70" width="540" height="210" rx="20" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
    <text x="440" y="137" font-size="30" font-weight="600" fill="#1F2937">Underwriting</text>
    <text x="440" y="189" font-size="21" fill="#4B5563">Owns risk rules</text>
    <text x="440" y="224" font-size="21" fill="#4B5563">Makes risk decision</text>
    <path d="M 440 280 L 440 440" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="255" y="336" width="370" height="44" rx="8" fill="#F7F7F5"/>
    <text x="440" y="365" font-size="21" font-weight="500" fill="#374151">RiskAccepted / RiskDeclined</text>
    <rect x="170" y="440" width="540" height="210" rx="20" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
    <text x="440" y="507" font-size="30" font-weight="600" fill="#1F2937">Policy Servicing</text>
    <text x="440" y="559" font-size="21" fill="#4B5563">Consumes decision</text>
    <text x="440" y="594" font-size="21" fill="#4B5563">Owns policy lifecycle</text>
  </g>
</svg>
